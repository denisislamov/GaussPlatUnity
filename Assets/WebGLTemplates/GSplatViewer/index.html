<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- TZ E7-T4: DPR forced to 1 (see devicePixelRatio below), no page pinch-zoom, full-screen canvas. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0d0d10; overflow: hidden; touch-action: none; }
    #unity-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #ddd; font: 16px system-ui, sans-serif; }
    #loading .bar { width: 240px; height: 4px; background: #333; margin-top: 12px; }
    #loading .bar div { height: 100%; width: 0; background: #e8834a; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div><div>Loading viewer…</div><div class="bar"><div id="progress"></div></div></div></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    // The viewer reads ?world=<url> and passes it to WorldLoader through SendMessage once Unity is up.
    var params = new URLSearchParams(window.location.search);
    var worldUrl = params.get("world");
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      arguments: [],
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // Splat rendering is fill-rate bound; rendering at the device's native DPR would cost 4x the pixels on a
      // phone for no visible gain.
      devicePixelRatio: 1
    };
    createUnityInstance(canvas, config, function (progress) {
      document.querySelector("#progress").style.width = (100 * progress) + "%";
    }).then(function (unityInstance) {
      document.querySelector("#loading").style.display = "none";
      if (worldUrl) unityInstance.SendMessage("World", "LoadFromPage", worldUrl);
      // Pause rendering while the tab is hidden: saves battery and avoids GPU context trouble on resume.
      document.addEventListener("visibilitychange", function () {
        unityInstance.SendMessage("World", document.hidden ? "PauseFromPage" : "ResumeFromPage", "");
      });
    }).catch(function (message) {
      document.querySelector("#loading").innerHTML = "<div>Could not start the viewer: " + message + "</div>";
    });
  </script>
</body>
</html>
